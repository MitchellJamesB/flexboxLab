<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>
    <style>
      .inner {
        padding: 12px;
      }

      .inner:nth-child(1) {
        background: lightcoral;
      }

      .inner:nth-child(2) {
        background: lightblue;
      }

      .inner:nth-child(3) {
        background: lightgreen;
      }
      .outer {
        display: flex;
        gap: 12px;
        background: #ddd; /* check out this slick shorthand instead of #DDDDDD; */
        padding: 12px 24px;
      }
      .justify-end {
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="outer justify-end">
      <div class="inner">Part of outer one, inner 1</div>
      <div class="inner">Part of outer one, Inner 2</div>
      <div class="inner">Part of outer one, Inner 3</div>
    </div>
    <div class="outer">
      <div class="inner">Part of outer one, inner 1</div>
      <div class="inner">Part of outer one, Inner 2</div>
      <div class="inner">Part of outer one, Inner 3</div>
    </div>
  </body>
</html>
